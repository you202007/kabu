name: Run Python Script

# どのタイミングで実行するか（トリガー）
on:
  push:
    branches: [ "main" ] # mainブランチに変更があったら実行
  
# ここで定期実行のスケジュールを設定します
  schedule:
    # 日本時間の夕方17時30分（UTCの8時30分）に実行
    # cron: '30 12 * * *'（UTCの12:30）
    # cron: '0 23 * * 0' （UTCでは前日日曜の23:00になるので注意。0が日曜）
    # cron: '0 * * * *'  （1時間ごとに実行）
    - cron: '30 8 * * *'
  
  # 手動実行もできるように残しておく
  workflow_dispatch:
  
# 実行する内容
jobs:
  run-python:
    runs-on: ubuntu-latest # 実行環境（最新のUbuntu）

    steps:
    # 1. リポジトリのコードを仮想環境に持ってくる
    - name: Checkout repository
      uses: actions/checkout@v4
    
    # 2. Pythonの環境をセットアップする
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10" # ここでPythonのバージョンを指定
        
    # 3. 必要なライブラリをインストールする（必要な場合）
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # pip install -r requirements.txt  ← 外部ライブラリを使う場合はこの行の「#」を消す
        
    # 4. 自分のPythonスクリプトを実行する
    - name: Run script
      env:
        # GitHubのSecretsに登録した値を「API_KEY」という名前でPythonに渡す
        API_KEY: ${{ secrets.MY_SECRET_KEY }}
      run: python 株価取得.py # ★ここをあなたが実行したいPythonファイル名に変更してください
