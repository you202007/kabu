name: Deploy dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # 20:00 JST. GitHub Actions cron is UTC.
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dashboard
        env:
          OPTIONS_OI_URL: ${{ secrets.OPTIONS_OI_URL }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          JQUANTS_REFRESH_TOKEN: ${{ secrets.JQUANTS_REFRESH_TOKEN }}
        run: |
          JQUANTS_KEY="${JQUANTS_API_KEY:-$JQUANTS_REFRESH_TOKEN}"
          if [ -n "$JQUANTS_KEY" ]; then
            python work/fetch_market_data.py --jquants-api-key "$JQUANTS_KEY" --period 3mo --output-dir outputs || python work/fetch_market_data.py --allow-proxy-options --period 3mo --output-dir outputs
          elif [ -n "$OPTIONS_OI_URL" ]; then
            python work/fetch_market_data.py --options-url "$OPTIONS_OI_URL" --period 3mo --output-dir outputs
          elif [ -n "$(find data -maxdepth 1 -type f \( -name 'derivatives_bars_daily_options_225*.csv.gz' -o -name 'derivatives_bars_daily_options_225*.csv' \) | head -n 1)" ] && [ -n "$(find data -maxdepth 1 -type f \( -name 'indices_bars_daily_topix*.csv.gz' -o -name 'indices_bars_daily_topix*.csv' \) | head -n 1)" ]; then
            OPTIONS_FILE="$(find data -maxdepth 1 -type f \( -name 'derivatives_bars_daily_options_225*.csv.gz' -o -name 'derivatives_bars_daily_options_225*.csv' \) | sort | tail -n 1)"
            TOPIX_FILE="$(find data -maxdepth 1 -type f \( -name 'indices_bars_daily_topix*.csv.gz' -o -name 'indices_bars_daily_topix*.csv' \) | sort | tail -n 1)"
            python work/fetch_market_data.py --options-csv "$OPTIONS_FILE" --topix-csv "$TOPIX_FILE" --period 3mo --output-dir outputs
          elif [ -f "data/options_oi.csv" ]; then
            python work/fetch_market_data.py --options-csv data/options_oi.csv --period 3mo --output-dir outputs
          else
            python work/fetch_market_data.py --allow-proxy-options --period 3mo --output-dir outputs
          fi
          cp outputs/sq_distortion_dashboard_generated.html outputs/sq.html
          cp index.html cockpit.html outputs/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
