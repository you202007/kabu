name: Deploy dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # 18:20 JST. Tokyo cash market is closed, and daily data is usually available.
    - cron: "20 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dashboard
        env:
          OPTIONS_OI_URL: ${{ secrets.OPTIONS_OI_URL }}
          JQUANTS_REFRESH_TOKEN: ${{ secrets.JQUANTS_REFRESH_TOKEN }}
        run: |
          if [ -n "$JQUANTS_REFRESH_TOKEN" ]; then
            python work/fetch_market_data.py --jquants-refresh-token "$JQUANTS_REFRESH_TOKEN" --period 3mo --output-dir outputs
          elif [ -n "$OPTIONS_OI_URL" ]; then
            python work/fetch_market_data.py --options-url "$OPTIONS_OI_URL" --period 3mo --output-dir outputs
          elif [ -f "data/options_oi.csv" ]; then
            python work/fetch_market_data.py --options-csv data/options_oi.csv --period 3mo --output-dir outputs
          else
            python work/fetch_market_data.py --allow-proxy-options --period 3mo --output-dir outputs
          fi
          cp outputs/sq_distortion_dashboard_generated.html outputs/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
