name: Run Portfolio Analysis

on:
  schedule:
    # 株価取得の完了を待って、毎日 日本時間の18時00分（UTCの9時00分）に実行
    - cron: '0 9 * * *'
  workflow_dispatch:     # 手動実行用

# GitHubに分析結果のCSVを保存するための権限
permissions:
  contents: write

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      # 分析用の計算ライブラリをインストール
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scipy tqdm pyarrow openpyxl
        
    - name: Run analysis script
      # ★先ほどのPythonコードを保存したファイル名に合わせてください
      run: python portfolio.py 
      
    - name: Commit and Push changes
      # 生成された predict フォルダなどの結果をGitHubに保存
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add JQuantsData/
        git commit -m "Auto-update portfolio [skip ci]" || echo "No changes to commit"
        git push
